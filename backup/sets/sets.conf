# every backup set: name, whether its SQLite databases are copied before the backup
# (see lib/resticbackup/dumps.py), and how many snapshots `restic forget` keeps.
# which sets go to which repository is SETS= in /etc/restic/<repo>.env.
#
# name     dump  retention
stack      yes   --keep-daily 7 --keep-weekly 4 --keep-monthly 12
appzips    no    --keep-last 1
media      yes   --keep-daily 7 --keep-weekly 4 --keep-monthly 12
comics     no    --keep-daily 7 --keep-weekly 4 --keep-monthly 12
